<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's in my bag?</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;           
        }
        body{
            background-color: #E5E3B9;
            margin: 0;
        }
        html, body{
            width: 100%;
            height: 100%;
        }
        #cover{
        z-index:-1;
        position: fixed;

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 90vw;

        pointer-events: none;
        }
        #cover img{
            width: 100%;
            display: block;
        }

        .spacer{
            height: 100vh;
        }

        .grid-section{
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: #9bb5b9;
            z-index: 10;
        }
        .alignment{
            position: relative;
            width: 60vw;
            margin: 5vw;            
        }

        .gridY{
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: clamp(2px, 5vw, 100px);
            pointer-events: none;
        }
        .gridY img{
            width: 100%;
            margin: 0 auto;
            object-fit: contain;
            display: block;
            opacity: 0;
        }
        
        .grid{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: clamp(2px, 5vw, 100px);

        }
        .grid img{
            width: 100%;
            margin: 0 auto;
            object-fit: contain;
            display: block;
        }
        

        #airpods1.show{
            opacity: 1;
            display: block;
        }



        #card{
            outline: 2px solid #56878F;
            border-radius: 4px;
        }
        #phone{
            outline: 2px solid #56878F;
            border-radius: 4px;            
        }
        #handcream{
            outline: 3px dotted #56878F;
            
        }
        #airpods{
            outline: 3px dotted #56878F;
        }

        .airpods-panel{
            display: none;
 
            width: 80vw;
            height: 80vh;
            background-color: #E5E3B9;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;

            z-index: 100;
        }
        .airpods-panel img{
            grid-column: 1 /2;
            display: block;
            width: 70%;            
        }
        .airpods-panel .airpods-panel-content{
            grid-column: 2/3;

        }
        .airpods-panel.show{
            opacity: 1;
            display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .airpodsClose {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: #56878F;
    z-index: 1001;
}

.phone-panel{
            display: none;
            width: 80vw;
            height: 80vh;
            background-color: #E5E3B9;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;

            z-index: 100;
        }

    </style>
</head>
<body>

 <div id="cover">
    <img src="bag.webp" alt="myBag">
 </div>

 <section class="spacer"></section>


<section class="grid-section">
    <div class="alignment"> 
        <div class="grid" id="baseGrid">
            <img id="airpods" src="inbag/airpods.webp" alt="music">
            <img id="cap" src="inbag/cap.webp" alt="cap">
            <img id="bracelet" src="inbag/bracelet.webp" alt="braacelet">
            <img id="hairclaw" src="inbag/hairclaw.webp" alt="">
            <img id="phone" src="inbag/phone.webp" alt="">
            <img id="card" src="inbag/id.webp" alt="">
            <img id="handcream" src="inbag/handcream.webp" alt="scent">
        </div>

        <div class="gridY" id="overlayGrid">
            <img id="airpods1" src="inbag/airpods1.webp" alt="music">
            <img id="cap1" src="inbag/cap1.webp" alt="cap">
            <img id="bracelet1" src="inbag/bracelet1.webp" alt="bracelet">
            <img id="hairclaw1" src="inbag/hairclaw1.webp" alt="">
            <img id="phone1" src="inbag/phone1.webp" alt="">
            <img id="card1" src="inbag/id1.webp" alt="">
            <img id="handcream1" src="inbag/handcream1.webp" alt="scent">
        </div>


    <div class="airpods-panel" id="airpodsPnl">
        <img src="inbag/airpods.webp" alt="Airpods">
        <div class="airpods-panel-content">
            <button class="airpodsClose" id="closeButton">X</button>
            <h2>Airpods</h2>
            <p><a href="https://open.spotify.com/playlist/5R957oWGEOXokXdYekcFWL?si=U-aA_IhMRAeirZr4qFDWfw&pi=mgbQPB_oSXiJg">Listen to my playlist</a></p>
        </div>
    </div>

      <div class="phone-panel" id="phonePnl">
        <img src="inbag/phone.webp" alt="phone">
        <div class="phone-panel-content">
            <button class="phoneClose" id="closeButton">X</button>
            <h2>Contact</h2>
            <p>email: clee37@risd.edu <br>instagram: chaewon_266</p>
        </div>
    </div>  

    </div>  
</section>

<script>
    const airpods =document.querySelector("#airpods");
    const airpods1 =document.querySelector("#airpods1");
    const airpodsPnl=document.querySelector("#airpodsPnl");
    const airpodsClose=document.querySelector(".airpodsClose");

airpods.addEventListener("mouseenter", function(){
  airpods1.classList.add("show");
});
airpods.addEventListener("mouseleave", function(){
  airpods1.classList.remove("show");
});
airpods.addEventListener("click", function(){
    airpodsPnl.classList.add("show");
});
airpodsClose.addEventListener("click", function(){
  airpodsPnl.classList.remove("show");
});


</script>

</body>
</html>

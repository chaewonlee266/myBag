<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's in my bag?</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;           
        }
        body{
            background-color: #E5E3B9;
            margin: 0;
        }
        html, body{
            width: 100%;
            height: 100%;
        }
        #cover{
        z-index:-1;
        position: fixed;

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        width: 90vw;

        pointer-events: none;
        }
        #cover img{
            width: 100%;
            display: block;
        }

        .spacer{
            height: 100vh;
        }

        .grid-section{
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: #9bb5b9;
        }
        

        .grid{
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 60vw;
            margin: 5vw;
            gap: clamp(2px, 5vw, 100px);

        }
        .grid img{
            width: 100%;
            margin: 0 auto;
            object-fit: contain;
            display: block;
        }
        #card{
            outline: 2px solid #56878F;
            border-radius: 4px;
        }
        #phone{
            outline: 2px solid #56878F;
            border-radius: 4px;            
        }
        #handcream{
            outline: 3px dotted #56878F;
            
        }
        #airpods{
            outline: 3px dotted #56878F;
        }
    </style>
</head>
<body>

 <div id="cover">
    <img src="bag.webp" alt="myBag">
 </div>

 <section class="spacer"></section>


<section class="grid-section">
    <div class="grid">
        <img id="airpods" src="inbag/airpods.webp" alt="music">
        <img id="cap" src="inbag/cap.webp" alt="cap">
        <img id="bracelet" src="inbag/bracelet.webp" alt="braacelet">
        <img id="hairclaw" src="inbag/hairclaw.webp" alt="">
        <img id="phone" src="inbag/phone.webp" alt="">
        <img id="card" src="inbag/id.webp" alt="">
        <img id="handcream" src="inbag/handcream.webp" alt="scent">
    </div>
</section>

</body>
</html>
